jitsi-multitrack-recorder {
  recording {
    directory = "/tmp"
    // Supported formats: "mka", "mka"
    format = "mka"
    // The maximum duration of a gap to repair using Opus PLC.
    max-gap-duration = 5 minutes
    // The number of events that can wait for processing before senders are suspended.
    event-channel-capacity = 100
    // Lifetime physical tracks, including gap-reset tracks with reused names.
    max-tracks = 4096
    // UTF-8 bytes per track name or endpoint identifier.
    max-track-metadata-bytes = 1024
  }
  log-finalize-output = true
  // finalize-script = /path/to/finalize.sh
  port = 8989
}
